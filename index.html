<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Mã QR Thiệp 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #fff0f5; 
      background-image: radial-gradient(#ffb3d9 2px, transparent 2px);
      background-size: 30px 30px;
      color: #555;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ff6fae;
      margin-bottom: 10px;
      font-size: 28px;
      text-shadow: 2px 2px 0px #fff;
    }

    .subtitle {
      text-align: center;
      color: #ff99c2;
      margin-bottom: 30px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-reset {
      display: block;
      margin: 0 auto 30px auto;
      background: #ff6fae;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 111, 174, 0.4);
      transition: all 0.2s;
    }
    .btn-reset:hover {
      background: #ff4d94;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 111, 174, 0.5);
    }
    .btn-reset:active {
      transform: translateY(1px);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .admin-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 8px 25px rgba(255, 111, 174, 0.15);
      border: 2px solid #ffe6f2;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .admin-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(255, 111, 174, 0.3);
      border-color: #ffb3d9;
    }

    .img-preview {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 3/4;
      display: block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .img-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .img-preview:hover img {
      transform: scale(1.08);
    }

    .info-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-name {
      font-weight: 700;
      font-size: 16px;
      color: #ff4d94;
      text-transform: capitalize;
      margin: 0;
      text-align: center;
    }
    .url-box {
      width: 100%;
      padding: 8px 12px;
      box-sizing: border-box;
      background: #fff;
      color: #ff6fae;
      border: 2px dashed #ffb3d9;
      border-radius: 12px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      text-align: center;
      transition: all 0.2s;
    }
    .url-box:focus, .url-box:hover {
      border-color: #ff6fae;
      background: #fff0f5;
    }

    .check-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      background: #ffe6f2;
      padding: 10px;
      border-radius: 16px;
      color: #ff4d94;
      font-weight: 600;
      transition: background 0.2s;
    }
    .check-wrap:hover {
      background: #ffb3d9;
      color: #fff;
    }
    .check-wrap input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #ff4d94;
    }
  </style>
</head>
<body>

  <h1>🎀 Kho Quản Lý Mã QR 🎀</h1>
  <div class="subtitle">cái nào em làm xong rồi thì em tick vào ô bên dưới nhé. nhớ đừng thoát ra k thì nó sẽ bị mất tình trạng, nhớ kiểm tra lại link của mấy ảnh cũ</div>

  <button class="btn-reset" id="btn-reset">✨ Bắt đầu đợt mới (Xoá hết tick) ✨</button>

  <div class="gallery" id="gallery"></div>

  <script>
    // Đã thêm 9 ảnh mới vào danh sách
    const images = [
      "chaulinh.jpg",
      "dangbaotram.jpg",
      "duckhoa3d.jpg",
      "khanhlinh.jpg",
      "khanhngoc.jpg",
      "khoinguyen3d.jpg",
      "nguyengiahan.jpg",
      "nguyenngocbaohan.jpg",
      "nguyentuankiet.jpg",
      "phamthaonhi3d.jpg",
      "bao anh 2.jpg",
      "tuan minh.jpg",
      "nguyen hoang bach.jpg",
      "dinh phong.jpg",
      "ko ten.jpg",
      "cao ngoc khanh hung.jpg",
      "tran tu anh.jpg",
      "thuy tien.jpg",
      "triinh duc tuan phong.jpg"
    ];

    const gallery = document.getElementById('gallery');
    
    let currentDomain = window.location.href.split('index.html')[0];
    if (!currentDomain.endsWith('/')) currentDomain += '/';

    let qrStatus = JSON.parse(localStorage.getItem('qrStatus')) || {};

    function renderGallery() {
      gallery.innerHTML = ''; 
      
      images.forEach((src, index) => {
        const displayName = src.replace('.jpg', '');
        const cardUrl = `${currentDomain}thiep.html?id=${index}`;
        const isChecked = qrStatus[index] ? 'checked' : '';

        const cardDiv = document.createElement('div');
        cardDiv.className = 'admin-card';

        cardDiv.innerHTML = `
          <a href="thiep.html?id=${index}" target="_blank" class="img-preview" title="Bấm để xem thử thiệp">
            <img src="${src}" alt="${displayName}">
          </a>
          
          <div class="info-area">
            <p class="card-name">${displayName}</p>
            
            <input type="text" class="url-box" value="${cardUrl}" readonly onclick="this.select()" title="Bấm vào để copy link">
            
            <label class="check-wrap">
              <input type="checkbox" class="qr-checkbox" data-id="${index}" ${isChecked}>
              Đã làm mã QR ✔️
            </label>
          </div>
        `;
        gallery.appendChild(cardDiv);
      });

      document.querySelectorAll('.qr-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
          const id = this.getAttribute('data-id');
          qrStatus[id] = this.checked; 
          localStorage.setItem('qrStatus', JSON.stringify(qrStatus));
        });
      });
    }

    document.getElementById('btn-reset').addEventListener('click', function() {
      if(confirm('Bạn có chắc muốn xoá toàn bộ dấu tick để bắt đầu đợt mới không?')) {
        qrStatus = {}; 
        localStorage.setItem('qrStatus', JSON.stringify(qrStatus)); 
        renderGallery(); 
      }
    });

    renderGallery();
  </script>
</body>
</html>
